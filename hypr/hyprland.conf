# Hyprland — port of yabai/yabairc + skhd/skhdrc.
#
# Modifier mapping keeps the macOS muscle memory 1:1:
#   macOS cmd -> $launch (SUPER)   app launching, screenshots, clipboard, lock
#   macOS alt -> $mod    (ALT)     all window/workspace management
#
# ponytail: ALT-as-window-mod shadows GTK/Qt menu mnemonics (Alt+F, Alt+E...).
# If that bites, swap the two lines below and everything follows.
$mod    = ALT
$launch = SUPER

$terminal = ghostty
$browser  = google-chrome-stable
$menu     = wofi --show drun

monitor = , preferred, auto, auto

# Two workspaces per monitor: 1-2 on HDMI-A-1, 3-4 on DP-2. waybar's
# persistent-workspaces list mirrors this, so keep the two in sync.
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:DP-2, default:true
workspace = 4, monitor:DP-2

# waybar is translucent (see waybar/style.css); blur what shows through it.
# ignore_alpha keeps the blur off the bar's fully transparent margins so the
# rounded corners stay clean.
#
# Syntax note: this is the post-0.53 rule form. The older
# `layerrule = blur, waybar` is rejected on 0.56 with "invalid field blur:
# missing a value" — every field now needs a value, the matcher is spelled
# `match:namespace`, and `ignorezero` was replaced by `ignore_alpha <float>`.
layerrule = blur on, ignore_alpha 0.01, match:namespace waybar

# ---- Autostart ---------------------------------------------------------------
exec-once = waybar
exec-once = swaybg -i /home/jesse/Pictures/Wallpapers/cyberpunkwallpaper.png -m fill
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = eww open-many dashboard metrics media
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ---- Environment -------------------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# NVIDIA (RTX 5070 / Blackwell, nvidia-open). Only these three are still needed
# on driver 555+; the old GBM_BACKEND and WLR_NO_HARDWARE_CURSORS lines are
# dropped deliberately — GBM_BACKEND breaks Firefox, and hardware cursors work.
# Harmless to leave in place on a machine with no NVIDIA GPU except
# LIBVA_DRIVER_NAME, which would need changing for AMD/Intel video decode.
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# ---- Layout & gaps -----------------------------------------------------------
# yabai: top 11 / bottom 7 / left 7 / right 7 padding, window_gap 6.
# Hyprland gaps_in is per-window, so 3 gives the same 6px between windows.
# The 32px external_bar reservation is gone: waybar reserves its own space.
# All four gaps are equal now: waybar's own margin-top provides the space above
# the bar, so an extra 4px on top here would make the gap under the bar wider
# than the one over it.
general {
    gaps_in     = 3
    gaps_out    = 7, 7, 7, 7
    border_size = 2
    col.active_border   = rgb(2cf9ed) rgb(eb46f9) 45deg
    col.inactive_border = rgb(003547)
    layout = dwindle
    resize_on_border = true
}

dwindle {
    # dwindle:pseudotile was removed in Hyprland 0.56 — pseudotiling is always
    # available, toggled by the `pseudo` dispatcher ($mod+D below).
    preserve_split = true
    force_split    = 2      # yabai window_placement second_child
}

# ---- Look --------------------------------------------------------------------
decoration {
    rounding = 8
    blur {
        enabled = true
        size    = 6
        passes  = 3
    }
    shadow {
        enabled = true
        range   = 20
        color   = rgba(2cf9ed33)
    }
}

animations {
    enabled = true
    bezier = neon, 0.05, 0.9, 0.1, 1.05
    animation = windows,     1, 4, neon, popin 80%
    animation = windowsOut,  1, 4, neon, popin 80%
    animation = border,      1, 8, default
    animation = fade,        1, 4, default
    animation = workspaces,  1, 4, neon, slide
}

misc {
    background_color = rgb(001f30)
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # background_color is only the fallback now — hyprpaper draws the actual
    # wallpaper (see hypr/hyprpaper.conf). It still shows through before
    # hyprpaper starts, and if hyprpaper isn't running at all.
}

input {
    kb_layout = us
    follow_mouse = 1

    # Pointer tuning. GNOME Settings writes to dconf, which only Mutter reads,
    # so under Hyprland these are the knobs that actually take effect.
    # sensitivity: -1.0 (slowest) .. 1.0 (fastest), 0 = untouched.
    # accel_profile: flat = raw 1:1, adaptive = libinput acceleration curve.
    sensitivity   = -0.55
    accel_profile = flat
}

# ---- Launching (macOS cmd) ---------------------------------------------------
bind = $launch, Return, exec, $terminal
bind = $launch SHIFT, Return, exec, $browser
bind = $launch, Space, exec, pkill wofi || $menu   # Spotlight (toggle)
bind = $launch, V, exec, pkill wofi || cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $launch, W, exec, [ -n "$(eww active-windows)" ] && eww close-all || eww open-many dashboard metrics media
bind = $launch CTRL, Q, exec, hyprlock             # macOS ctrl+cmd+Q
bind = $launch SHIFT, Q, exit

# Screenshots: macOS cmd+shift+4 (region) / cmd+shift+3 (full screen)
# grim writes to stdout, so tee it: the file lands in ~/Pictures/Screenshots
# and the image is still on the clipboard for an immediate paste.
$shot = ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = $launch SHIFT, 4, exec, grim -g "$(slurp)" - | tee $shot | wl-copy
bind = $launch SHIFT, 3, exec, grim - | tee $shot | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | tee $shot | wl-copy

# ---- Focus -------------------------------------------------------------------
# The skhd display-warp fallback is gone: movefocus already crosses monitors
# and Hyprland warps the cursor to the focused window by default.
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ---- Workspaces --------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# yabai space --create / --create+move. Workspaces here are dynamic, so
# "empty" is the equivalent and `space --destroy` (alt-q) has no counterpart.
bind = $mod, N, workspace, empty
bind = $mod SHIFT, N, movetoworkspace, empty

# ---- Windows -----------------------------------------------------------------
bind = $mod, X, killactive
bind = $mod, E, layoutmsg, togglesplit
bind = $mod, D, pseudo                 # closest thing to yabai zoom-parent
bind = $mod, F, fullscreen, 1          # maximize inside gaps (zoom-fullscreen)
bind = $mod SHIFT, F, fullscreen, 0    # true fullscreen (native-fullscreen)

# float, halve, center — yabai's `--toggle float; --grid 4:4:1:1:2:2`
bind = $mod, T, exec, hyprctl --batch "dispatch togglefloating ; dispatch resizeactive exact 50% 50% ; dispatch centerwindow"

bind = $mod SHIFT, H, swapwindow, l
bind = $mod SHIFT, J, swapwindow, d
bind = $mod SHIFT, K, swapwindow, u
bind = $mod SHIFT, L, swapwindow, r

bind = $launch SHIFT, H, movewindow, l
bind = $launch SHIFT, J, movewindow, d
bind = $launch SHIFT, K, movewindow, u
bind = $launch SHIFT, L, movewindow, r

# Float every window on this workspace and back (yabai bsp/float layouts).
bind = CTRL ALT, D, workspaceopt, allfloat

# Resize. yabai used two modifier groups because it picks an edge; Hyprland
# resizes the window, so h/l and j/k already cover both directions and the
# ctrl+alt+cmd group is dropped.
binde = CTRL ALT, H, resizeactive, -40 0
binde = CTRL ALT, L, resizeactive, 40 0
binde = CTRL ALT, K, resizeactive, 0 -40
binde = CTRL ALT, J, resizeactive, 0 40

bindm = $launch, mouse:272, movewindow
bindm = $launch, mouse:273, resizewindow

# ---- Gaps --------------------------------------------------------------------
bind  = $mod, A, exec, ~/.config/hypr/gaps.sh toggle
binde = $mod, G, exec, ~/.config/hypr/gaps.sh +
binde = $mod SHIFT, G, exec, ~/.config/hypr/gaps.sh -

bind = CTRL ALT $launch, R, exec, hyprctl reload

# ---- Media keys (no macOS equivalent to port) --------------------------------
# No backlight binds: a desktop monitor exposes no sysfs brightness device.
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
binde  = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde  = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# ---- Window rules ------------------------------------------------------------
# Hyprland 0.53 overhauled rule syntax: matchers are `match:<prop> <pattern>`
# and rules are `<name> <value>`. windowrulev2 and the old `rule, matcher` form
# are both gone.
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on
# Stops XWayland drag-and-drop surfaces from stealing focus.
windowrule = match:class ^$, match:title ^$, match:xwayland on, match:float on, match:fullscreen off, match:pin off, no_focus on
