# hyprlock — cyberpunk neon lock screen. Blurs a screenshot, so no wallpaper file.

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.4
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(2cf9ed)
    inner_color = rgb(003547)
    font_color = rgb(e6f7f5)
    check_color = rgb(af87ff)
    fail_color = rgb(ff2453)
    fail_text = <i>$FAIL</i>
    placeholder_text = <i>enter password</i>
    rounding = 8
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(2cf9ed)
    font_size = 90
    font_family = Hack Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(af87ff)
    font_size = 20
    font_family = Hack Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
